name: Automated Weekly Quotes Pipeline

on:
  schedule:
    # Runs automatically every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  # Allows triggering manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Content Pipeline
        run: python scripts/generate_quotes.py

      - name: Commit and Push Fresh Payload
        run: |
          git config --global user.name "BookGrid Bot"
          git config --global user.email "bot@bookgrid.app"
          git add quotes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated weekly quote payload update [skip ci]" && git push)

