<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOOKGRID® - Maintenance</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="bg-amber-400 font-['Inter'] h-[100dvh] w-full flex flex-col items-center justify-center p-6 text-center overflow-hidden">

  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md rounded-3xl p-8 shadow-2xl border border-amber-500/30 flex flex-col items-center">
    
    <!-- Colorful Clue-Palette Title -->
    <h1 class="font-['Cinzel'] font-extrabold text-3xl sm:text-4xl tracking-wider inline-flex items-baseline select-none mb-6">
      <span class="text-emerald-500">B</span>
      <span class="text-amber-500">O</span>
      <span class="text-sky-500">O</span>
      <span class="text-slate-400">K</span>
      <span class="text-emerald-500">G</span>
      <span class="text-amber-500">R</span>
      <span class="text-sky-500">I</span>
      <span class="text-slate-400">D</span>
      <span class="text-xs font-sans font-extrabold text-amber-500/80 ml-1 relative -top-2">®</span>
    </h1>

    <!-- Maintenance Notice -->
    <p class="text-slate-100 font-bold text-sm sm:text-base uppercase tracking-wide leading-relaxed mb-8">
      BOOKGRID® IS GOING THROUGH MAINTENANCE.<br>STAY TUNED...
    </p>

    <!-- Exit Button -->
    <button onclick="exitApp()" class="w-full max-w-xs bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-extrabold py-3 px-6 rounded-xl transition-all shadow-lg text-sm tracking-wider uppercase">
      EXIT
    </button>
  </div>

  <script>
    function exitApp() {
      // Attempt to close the tab/window across mobile browsers
      window.close();
      
      // Fallback redirect if browser security blocks automated tab closure
      setTimeout(() => {
        window.location.href = "about:blank";
      }, 200);
    }
  </script>
</body>
</html>
