<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BOOKGRID® - Universal Library Word Puzzle (Component 2)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Absolute root path for quotes.js -->
  <script src="/quotes.js?v=comp2"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              gold: '#d4af37',
              goldHover: '#b59226',
              accent: '#38bdf8'
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            body: ['Inter', 'sans-serif'],
            quote: ['Lora', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      width: 100%;
      margin: 0;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-brand-dark text-slate-800 dark:text-slate-100 font-body h-[100dvh] flex flex-col overflow-hidden no-select transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-brand-card border-b border-slate-200 dark:border-brand-border px-2 sm:px-4 py-2 flex items-center justify-between shrink-0 z-10 shadow-sm dark:shadow-none transition-colors duration-200">
    <div class="flex items-center space-x-1.5 shrink-0">
      <i class="fa-solid fa-book-bookmark text-amber-600 dark:text-brand-gold text-lg sm:text-xl"></i>
      <h1 class="font-serif font-bold text-sm sm:text-xl tracking-wider inline-flex items-baseline select-none">
        <span class="text-emerald-500">B</span>
        <span class="text-amber-500 dark:text-brand-gold">O</span>
        <span class="text-sky-500 dark:text-brand-accent">O</span>
        <span class="text-slate-400 dark:text-slate-500">K</span>
        <span class="text-emerald-500">G</span>
        <span class="text-amber-500 dark:text-brand-gold">R</span>
        <span class="text-sky-500 dark:text-brand-accent">I</span>
        <span class="text-slate-400 dark:text-slate-500">D</span>
        <span class="text-[9px] sm:text-xs font-sans font-extrabold text-amber-600/70 dark:text-brand-gold/70 ml-0.5 relative -top-1">®</span>
      </h1>
    </div>
    
    <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
      <button onclick="toggleTheme()" class="p-1.5 sm:p-2 text-slate-600 dark:text-slate-300 hover:text-amber-600 dark:hover:text-brand-gold transition-colors rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" title="Toggle Theme">
        <i id="theme-icon" class="fa-solid fa-sun text-sm sm:text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Sub-Header Status Bar -->
  <div class="bg-slate-200/80 dark:bg-slate-900/80 border-b border-slate-300 dark:border-brand-border/50 px-3 py-1.5 flex items-center justify-between text-[11px] sm:text-xs text-slate-600 dark:text-slate-400 shrink-0 transition-colors duration-200">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-medium text-slate-800 dark:text-slate-300">Component 2 Active</span>
    </div>
  </div>

  <!-- Main Game Container -->
  <main id="main-content" class="flex-1 overflow-y-auto p-4 flex flex-col items-center justify-center max-w-4xl mx-auto w-full text-center">
    <div id="status-display" class="p-5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl shadow-lg">
      Verifying data connection...
    </div>
  </main>

  <script>
    let GAME_DATA = {};

    function initTheme() {
      const savedTheme = localStorage.getItem('bookgrid_theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        updateThemeIcon(false);
      } else {
        document.documentElement.classList.add('dark');
        updateThemeIcon(true);
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('bookgrid_theme', isDark ? 'dark' : 'light');
      updateThemeIcon(isDark);
    }

    function updateThemeIcon(isDark) {
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      icon.className = isDark ? 'fa-solid fa-sun text-sm sm:text-lg text-amber-400' : 'fa-solid fa-moon text-sm sm:text-lg text-slate-700';
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      
      const display = document.getElementById('status-display');
      if (typeof window.BOOKGRID_DATA !== 'undefined' && window.BOOKGRID_DATA && window.BOOKGRID_DATA.daily) {
        GAME_DATA = window.BOOKGRID_DATA;
        const q = GAME_DATA.daily[0].en;
        display.style.borderColor = '#10b981';
        display.innerHTML = `
          <h3 class="text-emerald-500 font-bold mb-2">Component 2 Success!</h3>
          <p class="text-xs text-slate-400 mb-2">Header, Theme, and External Data are fully functional.</p>
          <em class="font-quote text-sm text-slate-200 block">"${q.quote}"</em>
          <span class="text-xs text-amber-500 mt-2 block">— ${q.author}</span>
        `;
      } else {
        display.style.borderColor = '#ef4444';
        display.innerHTML = `<span class="text-red-500 font-bold">Data load failed in Component 2.</span>`;
      }
    });
  </script>
</body>
</html>
