<!DOCTYPE html>
<html lang="en" class="h-full dark">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BOOKGRID® - Universal Library Word Puzzle (Component 4)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Absolute root path for quotes.js -->
  <script src="/quotes.js?v=comp4"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              gold: '#d4af37',
              goldHover: '#b59226',
              accent: '#38bdf8'
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            body: ['Inter', 'sans-serif'],
            quote: ['Lora', 'serif']
          }
        }
      }
    }
  </script>

  <style>
    .no-select {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      width: 100%;
      margin: 0;
      padding: 0;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .bg-word {
      display: inline-flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 3px;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    #floating-keyboard {
      position: fixed;
      bottom: calc(8px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }
    .key-btn {
      position: relative;
      background-color: #1e293b;
      color: #f8fafc;
      font-weight: 600;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      height: 2.35rem;
      min-width: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    .key-btn.key-correct { background-color: #059669 !important; color: #ffffff !important; }
    .key-btn.key-same-word { background-color: #d4af37 !important; color: #0f172a !important; font-weight: 700; }
    .key-btn.key-present { background-color: #0284c7 !important; color: #ffffff !important; }
    .key-btn.key-absent { background-color: #334155 !important; color: #64748b !important; opacity: 0.5; }

    .key-count-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      font-size: 0.6rem;
      font-weight: 800;
      line-height: 1;
      background-color: #0f172a;
      color: #d4af37;
      border: 1px solid #334155;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .action-btn {
      font-size: 0.75rem;
      height: 2.35rem;
      padding-left: 0.5rem;
      padding-right: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.375rem;
    }
    .tile-box {
      width: 1.65rem;
      height: 2.1rem;
      border-width: 1.5px;
      border-color: #334155;
      background-color: rgba(30, 41, 59, 0.9);
      border-radius: 0.375rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      cursor: pointer;
    }
    .tile-box.active {
      border-color: #d4af37;
      box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.3);
      background-color: #1e293b;
    }
    .tile-box.tile-correct { background-color: rgba(6, 78, 59, 0.9); border-color: #10b981; color: #6ee7b7; }
    .tile-box.tile-same-word { background-color: rgba(180, 130, 20, 0.9); border-color: #d4af37; color: #fef08a; }
    .tile-box.tile-present { background-color: rgba(12, 74, 110, 0.9); border-color: #38bdf8; color: #7dd3fc; }
    .tile-box.tile-absent { background-color: rgba(30, 41, 59, 0.5); border-color: #475569; color: #94a3b8; }

    .punct-symbol {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: #d4af37;
      padding-left: 0.05rem;
      padding-right: 0.05rem;
    }
    @media (min-width: 640px) {
      .key-btn { min-width: 40px; font-size: 0.875rem; height: 2.85rem; }
      .tile-box { width: 2.3rem; height: 2.8rem; font-size: 1.15rem; }
      .bg-word { gap: 4px; margin-right: 14px; margin-bottom: 12px; }
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-brand-dark text-slate-800 dark:text-slate-100 font-body h-[100dvh] flex flex-col overflow-hidden no-select transition-colors duration-200">

  <!-- Header -->
  <header class="bg-white dark:bg-brand-card border-b border-slate-200 dark:border-brand-border px-2 sm:px-4 py-2 flex items-center justify-between shrink-0 z-10 shadow-sm dark:shadow-none transition-colors duration-200">
    <div class="flex items-center space-x-1.5 shrink-0">
      <i class="fa-solid fa-book-bookmark text-amber-600 dark:text-brand-gold text-lg sm:text-xl"></i>
      <h1 class="font-serif font-bold text-sm sm:text-xl tracking-wider inline-flex items-baseline select-none">
        <span class="text-emerald-500">B</span><span class="text-amber-500 dark:text-brand-gold">O</span><span class="text-sky-500 dark:text-brand-accent">O</span><span class="text-slate-400 dark:text-slate-500">K</span><span class="text-emerald-500">G</span><span class="text-amber-500 dark:text-brand-gold">R</span><span class="text-sky-500 dark:text-brand-accent">I</span><span class="text-slate-400 dark:text-slate-500">D</span>
      </h1>
    </div>
    <div class="flex items-center space-x-1 sm:space-x-2 shrink-0">
      <button onclick="toggleTheme()" class="p-1.5 sm:p-2 text-slate-600 dark:text-slate-300 hover:text-amber-600 dark:hover:text-brand-gold transition-colors rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
        <i id="theme-icon" class="fa-solid fa-sun text-sm sm:text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Sub-Header Status Bar -->
  <div class="bg-slate-200/80 dark:bg-slate-900/80 border-b border-slate-300 dark:border-brand-border/50 px-3 py-1.5 flex items-center justify-between text-[11px] sm:text-xs text-slate-600 dark:text-slate-400 shrink-0">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
      <span class="font-medium text-slate-800 dark:text-slate-300">Component 4: Virtual Keyboard Active</span>
    </div>
  </div>

  <!-- Main Game Container -->
  <main id="main-content" class="flex-1 overflow-y-auto p-3 sm:p-4 flex flex-col items-center justify-start max-w-4xl mx-auto w-full pb-36">
    <div id="quote-container" class="w-full flex flex-wrap justify-center items-center py-4"></div>
  </main>

  <!-- Floating Virtual Keyboard -->
  <div id="floating-keyboard" class="w-[98%] max-w-md bg-white/95 dark:bg-brand-card/95 backdrop-blur-md border border-slate-200 dark:border-brand-border rounded-2xl shadow-2xl p-2">
    <div class="flex flex-col gap-1">
      <div class="flex justify-center gap-1">
        <button onclick="handleVirtualKey('Q')" class="key-btn">Q<span class="key-count-badge" id="badge-Q"></span></button>
        <button onclick="handleVirtualKey('W')" class="key-btn">W<span class="key-count-badge" id="badge-W"></span></button>
        <button onclick="handleVirtualKey('E')" class="key-btn">E<span class="key-count-badge" id="badge-E"></span></button>
        <button onclick="handleVirtualKey('R')" class="key-btn">R<span class="key-count-badge" id="badge-R"></span></button>
        <button onclick="handleVirtualKey('T')" class="key-btn">T<span class="key-count-badge" id="badge-T"></span></button>
        <button onclick="handleVirtualKey('Y')" class="key-btn">Y<span class="key-count-badge" id="badge-Y"></span></button>
        <button onclick="handleVirtualKey('U')" class="key-btn">U<span class="key-count-badge" id="badge-U"></span></button>
        <button onclick="handleVirtualKey('I')" class="key-btn">I<span class="key-count-badge" id="badge-I"></span></button>
        <button onclick="handleVirtualKey('O')" class="key-btn">O<span class="key-count-badge" id="badge-O"></span></button>
        <button onclick="handleVirtualKey('P')" class="key-btn">P<span class="key-count-badge" id="badge-P"></span></button>
      </div>
      <div class="flex justify-center gap-1">
        <button onclick="handleVirtualKey('A')" class="key-btn">A<span class="key-count-badge" id="badge-A"></span></button>
        <button onclick="handleVirtualKey('S')" class="key-btn">S<span class="key-count-badge" id="badge-S"></span></button>
        <button onclick="handleVirtualKey('D')" class="key-btn">D<span class="key-count-badge" id="badge-D"></span></button>
        <button onclick="handleVirtualKey('F')" class="key-btn">F<span class="key-count-badge" id="badge-F"></span></button>
        <button onclick="handleVirtualKey('G')" class="key-btn">G<span class="key-count-badge" id="badge-G"></span></button>
        <button onclick="handleVirtualKey('H')" class="key-btn">H<span class="key-count-badge" id="badge-H"></span></button>
        <button onclick="handleVirtualKey('J')" class="key-btn">J<span class="key-count-badge" id="badge-J"></span></button>
        <button onclick="handleVirtualKey('K')" class="key-btn">K<span class="key-count-badge" id="badge-K"></span></button>
        <button onclick="handleVirtualKey('L')" class="key-btn">L<span class="key-count-badge" id="badge-L"></span></button>
      </div>
      <div class="flex justify-center gap-1">
        <button onclick="handleVirtualKey('Z')" class="key-btn">Z<span class="key-count-badge" id="badge-Z"></span></button>
        <button onclick="handleVirtualKey('X')" class="key-btn">X<span class="key-count-badge" id="badge-X"></span></button>
        <button onclick="handleVirtualKey('C')" class="key-btn">C<span class="key-count-badge" id="badge-C"></span></button>
        <button onclick="handleVirtualKey('V')" class="key-btn">V<span class="key-count-badge" id="badge-V"></span></button>
        <button onclick="handleVirtualKey('B')" class="key-btn">B<span class="key-count-badge" id="badge-B"></span></button>
        <button onclick="handleVirtualKey('N')" class="key-btn">N<span class="key-count-badge" id="badge-N"></span></button>
        <button onclick="handleVirtualKey('M')" class="key-btn">M<span class="key-count-badge" id="badge-M"></span></button>
        <button onclick="handleBackspace()" class="action-btn bg-slate-300 dark:bg-slate-700 hover:bg-slate-400 text-slate-800 dark:text-slate-200">
          <i class="fa-solid fa-delete-left"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    let GAME_DATA = {};
    let targetQuote = "";
    let cleanLetters = [];
    let wordAssignments = [];
    let wordsCleanLetters = [];
    let userGuesses = [];
    let lockedTiles = [];
    let keyStates = {};
    let letterCountsTotal = {};
    let letterCountsSolved = {};
    let selectedTileIndex = 0;

    function initTheme() {
      const savedTheme = localStorage.getItem('bookgrid_theme');
      if (savedTheme === 'light') document.documentElement.classList.remove('dark');
      else document.documentElement.classList.add('dark');
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('bookgrid_theme', isDark ? 'dark' : 'light');
    }

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      if (typeof window.BOOKGRID_DATA !== 'undefined' && window.BOOKGRID_DATA && window.BOOKGRID_DATA.daily) {
        GAME_DATA = window.BOOKGRID_DATA;
        targetQuote = GAME_DATA.daily[0].en.quote;
        setupBoard();
      }
    });

    function setupBoard() {
      cleanLetters = [];
      wordAssignments = [];
      wordsCleanLetters = [];
      userGuesses = [];
      lockedTiles = [];
      keyStates = {};
      letterCountsTotal = {};
      letterCountsSolved = {};
      selectedTileIndex = 0;

      const rawWords = targetQuote.split(' ');
      const container = document.getElementById('quote-container');
      container.innerHTML = '';

      let globalLetterIndex = 0;

      rawWords.forEach((wordStr, wordIdx) => {
        const wordEl = document.createElement('div');
        wordEl.className = 'bg-word';
        const currentWordLetters = [];

        for (let i = 0; i < wordStr.length; i++) {
          const char = wordStr[i];
          const upperChar = char.toUpperCase();

          if (upperChar >= 'A' && upperChar <= 'Z') {
            cleanLetters.push(upperChar);
            wordAssignments.push(wordIdx);
            currentWordLetters.push(upperChar);
            userGuesses.push('');
            lockedTiles.push(false);

            letterCountsTotal[upperChar] = (letterCountsTotal[upperChar] || 0) + 1;
            letterCountsSolved[upperChar] = 0;

            const tile = document.createElement('div');
            tile.id = `tile-${globalLetterIndex}`;
            tile.className = 'tile-box';
            
            const idx = globalLetterIndex;
            tile.onclick = () => {
              if (!lockedTiles[idx]) {
                selectedTileIndex = idx;
                renderBoard();
              }
            };

            wordEl.appendChild(tile);
            globalLetterIndex++;
          } else {
            const punct = document.createElement('span');
            punct.className = 'punct-symbol';
            punct.innerText = char;
            wordEl.appendChild(punct);
          }
        }
        wordsCleanLetters.push(currentWordLetters);
        container.appendChild(wordEl);
      });

      findNextAvailableTileIndex();
      renderBoard();
    }

    function findNextAvailableTileIndex() {
      for (let i = selectedTileIndex; i < cleanLetters.length; i++) {
        if (!lockedTiles[i]) {
          selectedTileIndex = i;
          return;
        }
      }
      for (let i = 0; i < selectedTileIndex; i++) {
        if (!lockedTiles[i]) {
          selectedTileIndex = i;
          return;
        }
      }
    }

    function handleVirtualKey(letter) {
      if (lockedTiles[selectedTileIndex]) return;

      userGuesses[selectedTileIndex] = letter;
      const wordIdx = wordAssignments[selectedTileIndex];
      const currentWordLetters = wordsCleanLetters[wordIdx] || [];

      if (letter === cleanLetters[selectedTileIndex]) {
        lockedTiles[selectedTileIndex] = true;
        letterCountsSolved[letter] = (letterCountsSolved[letter] || 0) + 1;
      }

      findNextAvailableTileIndex();
      renderBoard();
    }

    function handleBackspace() {
      if (!lockedTiles[selectedTileIndex] && userGuesses[selectedTileIndex] !== '') {
        userGuesses[selectedTileIndex] = '';
      } else {
        let prev = selectedTileIndex - 1;
        while (prev >= 0 && lockedTiles[prev]) prev--;
        if (prev >= 0 && !lockedTiles[prev]) {
          selectedTileIndex = prev;
          userGuesses[selectedTileIndex] = '';
        }
      }
      renderBoard();
    }

    function renderBoard() {
      for (let i = 0; i < cleanLetters.length; i++) {
        const tile = document.getElementById(`tile-${i}`);
        if (!tile) continue;

        const val = userGuesses[i] || '';
        tile.innerText = val;
        tile.classList.remove('active', 'tile-correct', 'tile-same-word', 'tile-present', 'tile-absent');

        if (lockedTiles[i]) {
          tile.classList.add('tile-correct');
        } else if (val !== '') {
          const wordIdx = wordAssignments[i];
          const currentWordLetters = wordsCleanLetters[wordIdx] || [];

          if (val === cleanLetters[i]) {
            tile.classList.add('tile-correct');
          } else if (currentWordLetters.includes(val)) {
            tile.classList.add('tile-same-word');
          } else if (cleanLetters.includes(val)) {
            tile.classList.add('tile-present');
          } else {
            tile.classList.add('tile-absent');
          }
        } else if (i === selectedTileIndex) {
          tile.classList.add('active');
        }
      }
    }
  </script>
</body>
</html>
