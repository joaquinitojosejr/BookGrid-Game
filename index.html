<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOOKGRID® - Universal Library Word Puzzle</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--accent-color);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .quote-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .quote-text {
            font-size: 1.25rem;
            line-height: 1.6;
            font-style: italic;
            margin-bottom: 16px;
        }

        .quote-meta {
            font-size: 0.95rem;
            color: var(--accent-color);
            font-weight: 600;
        }

        .quote-source {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        .trivia-box {
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>BOOKGRID®</h1>
        <div class="subtitle">Universal Library of Human Thought</div>
    </header>

    <main class="quote-card" id="quoteCard">
        <div class="quote-text" id="quoteDisplay">Loading today's quote...</div>
        <div class="quote-meta" id="authorDisplay"></div>
        <div class="quote-source" id="sourceDisplay"></div>
        <div class="trivia-box" id="triviaDisplay"></div>
    </main>

    <div class="controls">
        <button onclick="toggleLanguage()">Switch Language (EN/ES)</button>
        <button onclick="loadRandomQuote()">Next Quote</button>
    </div>

    <script>
        // Guaranteed In-Memory Fallback Payload
        const FALLBACK_PAYLOAD = {
            "daily": [
                {
                    "en": { "quote": "Real courage is when you know you're licked before you begin.", "author": "Harper Lee", "title": "To Kill a Mockingbird", "published": "1960", "trivia": "Spoken by Atticus Finch in Chapter 11.", "category": "Classic Literature", "subCategory": "Fiction" },
                    "es": { "quote": "El verdadero valor es cuando sabes que estás vencido antes de empezar.", "author": "Harper Lee", "title": "Matar a un ruiseñor", "published": "1960", "trivia": "Dicho por Atticus Finch en el capítulo 11.", "category": "Literatura Clásica", "subCategory": "Ficción" }
                }
            ]
        };

        let activePayload = FALLBACK_PAYLOAD;
        let currentLang = 'en';
        let currentIndex = 0;

        async function initGame() {
            try {
                const response = await fetch('./quotes.json');
                if (response.ok) {
                    activePayload = await response.json();
                }
            } catch (err) {
                console.warn('Could not load dynamic quotes.json, using static fallback.', err);
            }
            renderQuote();
        }

        function renderQuote() {
            const list = activePayload.daily || FALLBACK_PAYLOAD.daily;
            const item = list[currentIndex % list.length][currentLang];

            document.getElementById('quoteDisplay').textContent = `"${item.quote}"`;
            document.getElementById('authorDisplay').textContent = `— ${item.author}`;
            document.getElementById('sourceDisplay').textContent = `${item.title} (${item.published})`;
            document.getElementById('triviaDisplay').textContent = `💡 Trivia: ${item.trivia}`;
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'es' : 'en';
            renderQuote();
        }

        function loadRandomQuote() {
            const list = activePayload.daily || FALLBACK_PAYLOAD.daily;
            currentIndex = (currentIndex + 1) % list.length;
            renderQuote();
        }

        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
